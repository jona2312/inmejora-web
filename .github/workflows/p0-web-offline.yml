name: P0 Web offline CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.gate }} (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate: [isolation-and-build, lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Verify package manager
        run: test "$(npm --version)" = "10.8.2"
      - name: Install exact dependencies (registry access only, lifecycle scripts disabled)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolation tests and build with OS network disabled
        if: matrix.gate == 'isolation-and-build'
        shell: bash
        run: |
          sudo unshare --net -- "$(command -v node)" --experimental-vm-modules --import ./scripts/ci/offline-guard.mjs --test tests/ci/isolation.test.mjs tests/ci/provider-containment.test.mjs tests/ci/payment-containment.test.mjs tests/ci/payment-status-truth.test.mjs tests/ci/lint-error-regression.test.mjs tests/ci/admin-route.test.mjs tests/ci/identity-containment.test.mjs
          sudo unshare --net -- "$(command -v node)" scripts/ci/build.mjs
      - name: Lint with OS network disabled
        if: matrix.gate == 'lint'
        shell: bash
        run: sudo unshare --net -- "$(command -v node)" --import ./scripts/ci/offline-guard.mjs node_modules/eslint/bin/eslint.js .
